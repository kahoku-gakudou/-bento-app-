<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>今日のメニュー</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 30px;
        }
        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        #menu {
            margin-top: 20px;
            text-align: left;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #f9f9f9;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        .item {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<h2>今日のメニュー</h2>

<!-- ★ここにメニューが自動で表示される -->
<div id="menu"></div>

<!-- トップページに戻るボタン -->
<a class="btn" href="index.html">トップに戻る</a>

<!-- Google Sheets 読み込みコード（index.html と同じ仕組み） -->
<script>
// Google Sheets の公開URL（あなたのシート）
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1Q-HUX6uJrj6Wu8l_6d5ovTWHF-yTTYsaLzihLMO6AIw/export?format=csv";


// CSVを読み込む
async function loadMenu() {
    const response = await fetch(SHEET_URL);
    const csvText = await response.text();
    const rows = csvText.split("\n").map(r => r.split(","));

    const header = rows[0];
    const data = rows.slice(1);

    return { header, data };
}

// 日付で行を探す
function findMenuByDate(data, date) {
    return data.find(row => row[0] === date);
}

// メニューを表示する
function displayMenu(row, header) {
    const container = document.getElementById("menu");
    container.innerHTML = "";

    if (!row) {
        container.innerHTML = "<p>この日のメニューは登録されていません。</p>";
        return;
    }

    for (let i = 1; i < header.length; i += 3) {
        const name = row[i];
        const ingredients = row[i + 1];
        const allergy = row[i + 2];

        if (!name || name.trim() === "") continue;

        const itemHTML = `
            <div class="item">
                <h3>${name}</h3>
                <p><strong>原材料：</strong> ${ingredients}</p>
                <p><strong>アレルギー：</strong> ${allergy}</p>
            </div>
            <hr>
        `;
        container.innerHTML += itemHTML;
    }
}

// 今日の日付を自動で読み込む（例：2026-07-28）
const today = new Date();
const y = today.getFullYear();
const m = String(today.getMonth() + 1).padStart(2, "0");
const d = String(today.getDate()).padStart(2, "0");
const todayStr = `${y}-${m}-${d}`;

// 今日のメニューを表示
(async () => {
    const { header, data } = await loadMenu();
    const row = findMenuByDate(data, todayStr);
    displayMenu(row, header);
})();
</script>

</body>
</html>
