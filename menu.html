<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メニューカレンダー</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #F7FBFF;
        }

        .month-title {
            font-size: 24px;
            margin-top: 40px;
            color: #2C786C;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin: 20px auto;
            width: 90%;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .weekday {
            font-weight: bold;
            color: #333;
        }

        .date-cell {
            padding: 10px;
            border-radius: 6px;
            min-height: 50px;
        }

        .date-btn {
            background: #2196F3;
            color: white;
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
        }

        .no-menu {
            background: #ccc;
            color: #666;
            padding: 10px;
            border-radius: 6px;
        }

        #menu {
            margin-top: 20px;
            text-align: left;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #f9f9f9;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .item {
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            background-color: #5FD068;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h2>メニューカレンダー</h2>

<div id="calendar-container"></div>

<div id="menu"></div>

<a class="btn" href="index.html">トップに戻る</a>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1Q-HUX6uJrj6Wu8l_6d5ovTWHF-yTTYsaLzihLMO6AIw/export?format=csv";

async function loadMenu() {
    const response = await fetch(SHEET_URL);
    const csvText = await response.text();
    const rows = csvText.split("\n").map(r => r.split(","));
    const header = rows[0];
    const data = rows.slice(1);
    return { header, data };
}

function findMenuByDate(data, date) {
    return data.find(row => row[0] === date);
}

function displayMenu(row, header) {
    const container = document.getElementById("menu");
    container.innerHTML = "";

    if (!row) {
        container.innerHTML = "<p>この日のメニューは登録されていません。</p>";
        return;
    }

    for (let i = 1; i < header.length; i += 3) {
        const name = row[i];
        const ingredients = row[i + 1];
        const allergy = row[i + 2];

        if (!name || name.trim() === "") continue;

        container.innerHTML += `
            <div class="item">
                <h3>${name}</h3>
                <p><strong>原材料：</strong> ${ingredients}</p>
                <p><strong>アレルギー：</strong> ${allergy}</p>
            </div>
            <hr>
        `;
    }
}

async function generateRealCalendar() {
    const { header, data } = await loadMenu();
    const container = document.getElementById("calendar-container");

    const grouped = {};

    data.forEach(row => {
        const date = row[0];
        if (!date || date.trim() === "") return;

        const [year, month, day] = date.split("-");
        const key = `${year}-${month}`;

        if (!grouped[key]) grouped[key] = [];
        grouped[key].push({ date, day: Number(day), row });
    });

    Object.keys(grouped).forEach(monthKey => {
        const [year, month] = monthKey.split("-");
        const monthTitle = document.createElement("h3");
        monthTitle.className = "month-title";
        monthTitle.innerText = `${year}年${Number(month)}月`;
        container.appendChild(monthTitle);

        const calendar = document.createElement("div");
        calendar.className = "calendar";

        const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
        weekdays.forEach(w => {
            const cell = document.createElement("div");
            cell.className = "weekday";
            cell.innerText = w;
            calendar.appendChild(cell);
        });

        const firstDate = new Date(`${monthKey}-01`);
        const startDay = firstDate.getDay();

        for (let i = 0; i < startDay; i++) {
            const empty = document.createElement("div");
            empty.className = "date-cell";
            calendar.appendChild(empty);
        }

        grouped[monthKey].forEach(item => {
            const cell = document.createElement("div");
            cell.className = "date-cell";

            const hasMenu = item.row.slice(1).some(v => v.trim() !== "");

            if (hasMenu) {
                const btn = document.createElement("div");
                btn.className = "date-btn";
                btn.innerText = item.day;
                btn.onclick = () => showMenu(item.date);
                cell.appendChild(btn);
            } else {
                const btn = document.createElement("div");
                btn.className = "no-menu";
                btn.innerText = item.day;
                cell.appendChild(btn);
            }

            calendar.appendChild(cell);
        });

        container.appendChild(calendar);
    });
}

async function showMenu(date) {
    const { header, data } = await loadMenu();
    const row = findMenuByDate(data, date);
    displayMenu(row, header);
}

generateRealCalendar();
</script>

</body>
</html>
